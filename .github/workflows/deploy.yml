name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch school holidays data
        env:
          API_URL: https://opendata.rijksoverheid.nl/api/v1/infotypes/schoolholidays?output=json
        run: |
          mkdir -p public/api
          # Try to fetch live data; if it fails, fall back to the bundled sample.
          if curl -fsSL "$API_URL" -o /tmp/schoolholidays.json; then
            cp /tmp/schoolholidays.json public/api/schoolholidays.json
          else
            echo "Falling back to bundled sample data"
            cp public/api/schoolholidays.sample.json public/api/schoolholidays.json
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
